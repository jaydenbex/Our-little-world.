<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For My Baby ❤️</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Georgia, serif;
      text-align: center;
      color: white;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #8e44ad);
      padding: 20px;
      box-sizing: border-box;
    }

    .card {
      max-width: 420px;
      width: 100%;
      padding: 30px 22px;
      box-sizing: border-box;
      background: rgba(255, 255, 255, 0.16);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 25px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
    }

    h1 {
      font-size: 2em;
    }

    p {
      line-height: 1.8;
      font-size: 17px;
    }

    button {
      background: #fff;
      color: #d6336c;
      border: none;
      padding: 14px 24px;
      border-radius: 30px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 15px;
    }

    audio {
      width: 100%;
      margin-top: 15px;
    }

    .heart {
      font-size: 35px;
    }
  </style>
</head>

<body>
  <div class="card">
    <div class="heart">❤️</div>

    <h1>Hey, My Baby 🥹❤️</h1>

    <p>
      I made this little space just for you.
      No matter how ordinary a day may seem,
      you still have a special place in my heart.
    </p>

    <p>
      There's something I want you to hear
      in my own voice. Tap below, baby. ❤️
    </p>

    <audio controls preload="metadata">
      <source src="voice.mp3" type="audio/mpeg">
      Your browser cannot play this audio.
    </audio>

    <p>
      Take your time listening, my love. 🫶
    </p>

    <div class="heart">💖</div>
  </div>
</body>
      </html>
